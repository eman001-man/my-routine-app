<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Global Routine</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; flex-direction: column; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { color: #1a73e8; text-align: center; margin-bottom: 1.5rem; }
        .input-group { display: flex; gap: 10px; margin-bottom: 1.5rem; }
        input { flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        button { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .add-btn { background-color: #1a73e8; color: white; }
        .add-btn:hover { background-color: #1557b0; }
        ul { list-style: none; padding: 0; }
        li { background: #fff; border-bottom: 1px solid #eee; padding: 12px; display: flex; align-items: center; justify-content: space-between; }
        .delete-btn { color: #ff4d4d; background: none; font-size: 1.2rem; }
        
        /* 川柳アプリへのリンクボタン */
        .nav-link { 
            margin-top: 20px; 
            display: block; 
            text-align: center; 
            text-decoration: none; 
            color: #8c2727; 
            font-weight: bold;
            padding: 10px;
            border: 2px solid #8c2727;
            border-radius: 30px;
            transition: 0.3s;
        }
        .nav-link:hover { background-color: #8c2727; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>My Daily Routine</h1>
    
    <div class="input-group">
        <input type="text" id="routineInput" placeholder="Enter a new routine...">
        <button class="add-btn" onclick="addRoutine()">Add</button>
    </div>

    <ul id="routineList"></ul>

    <a href="senryu.html" class="nav-link">✍️ Try AI Senryu (Haiku)</a>
</div>

<script>
    const routineList = document.getElementById('routineList');
    let routines = JSON.parse(localStorage.getItem('myRoutines')) || [];

    function renderRoutines() {
        routineList.innerHTML = '';
        routines.forEach((routine, index) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${routine}</span>
                <button class="delete-btn" onclick="deleteRoutine(${index})">×</button>
            `;
            routineList.appendChild(li);
        });
        localStorage.setItem('myRoutines', JSON.stringify(routines));
    }

    function addRoutine() {
        const input = document.getElementById('routineInput');
        if (input.value.trim() !== '') {
            routines.push(input.value.trim());
            input.value = '';
            renderRoutines();
        }
    }

    function deleteRoutine(index) {
        routines.splice(index, 1);
        renderRoutines();
    }

    renderRoutines();
</script>

</body>
</html>
