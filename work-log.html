<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; --record-in: #e74c3c; --record-out: #2ecc71; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; }
        .container { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 20px; max-width: 400px; margin: auto; }
        
        h1 { font-size: 1.2rem; color: var(--primary); text-align: center; margin-bottom: 20px; }

        /* カレンダーのスタイル */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; margin-bottom: 20px; }
        .day-name { font-size: 0.7rem; color: #999; font-weight: bold; padding-bottom: 5px; }
        .day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; font-size: 0.9rem; position: relative; background: #fafafa; }
        .day.today { border: 2px solid var(--accent); font-weight: bold; }
        .dot-container { display: flex; gap: 2px; margin-top: 2px; }
        .dot { width: 4px; height: 4px; border-radius: 50%; }
        .dot-in { background: var(--record-in); }
        .dot-out { background: var(--record-out); }

        /* 打刻ボタン */
        .punch-area { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .in { background-color: var(--accent); }
        .out { background-color: var(--primary); }
        .btn small { display: block; font-size: 0.65rem; opacity: 0.8; font-weight: normal; margin-top: 2px; }
