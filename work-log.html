<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; --in-color: #e74c3c; --out-color: #2ecc71; }
        body { font-family: sans-serif; background-color: var(--bg); margin: 0; padding: 10px; color: #333; }
        .container { background: white; border-radius: 20px; padding: 20px; max-width: 400px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 1.1rem; text-align: center; color: var(--primary); margin: 0 0 15px 0; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
        .day-header { font-size: 0.6rem; text-align: center; color: #999; font-weight: bold; padding-bottom: 5px; }
        .day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fdfdfd; border-radius: 6px; font-size: 0.8rem; border: 1px solid #f0f0f0; min-height: 40px; position: relative; }
        .day.today { border: 2px solid var(--accent); font-weight: bold; }
        .dots { display: flex; gap: 2px; position: absolute; bottom: 4px; width: 100%; justify-content: center; }
        .dot { width: 4px; height: 4px; border-radius: 50%; }
        .dot-in { background: var(--in-color); }
        .dot-out { background: var(--out-color); }
        .punch-area { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        button { padding: 12px 2px; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; }
        .in { background-color: var(--accent); }
        .out { background-color: var(--primary); }
        button small { display: block; font-size: 0.6rem; font-weight: normal; margin-top: 2px; opacity: 0.9; }
        .history-section { border-top: 2px solid #f0f0f0; padding-top: 15px; }
        h3 { font-size: 0.85rem; margin: 0 0 10px 0; color: #777; }
        .history-list { max-height: 200px; overflow-y: auto; font-size: 0.8rem; margin-bottom: 15px; }
        .log-item { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid #f9f9f9; }
        .log-tag { font-size: 0.65rem; padding: 2px 4px; border-radius: 3px; color: #fff; margin-right: 5px; }
        
        /* ダウンロードボタンのスタイル */
        .download-btn { width: 100%; background: none; border: 1px dashed #ccc; color: #888; padding: 10px; border-radius: 10px; font-size: 0.75rem; cursor: pointer; }
        .download-btn:hover { background: #f0f0f0; }
    </style>
</head>
<body>
<div class="container">
    <h1 id="monthDisplay">My Calendar</h1>
    <div class="calendar-grid" id="calendar">
        <div class="day-header">S</div><div class="day-header">M</div><div class="day-header">T</div>
        <div class="day-header">W</div><div class="day-header">T</div><div class="day-header">F</div><div class="day-header">S</div>
    </div>
    <div class="punch-area">
        <button class="in" onclick="saveRecord('IN')">Check In<small>काम सुरु / 開始</small></button>
        <button class="out" onclick="saveRecord('OUT')">Check Out<small>काम सकियो
