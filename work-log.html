<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; --in-color: #e74c3c; --out-color: #2ecc71; }
        body { font-family: sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { background: white; border-radius: 20px; padding: 20px; max-width: 450px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        h1 { font-size: 1.2rem; text-align: center; color: var(--primary); margin-bottom: 15px; }
        
        /* カレンダー表示 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 20px; }
        .day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8f9fa; border-radius: 8px; font-size: 0.8rem; position: relative; border: 1px solid #eee; }
        .day.today { border: 2px solid var(--accent); font-weight: bold; background: #fff; }
        .dots { display: flex; gap: 2px; margin-top: 2px; }
        .dot { width: 4px; height: 4px; border-radius: 50%; }
        .dot-in { background: var(--in-color); }
        .dot-out { background: var(--out-color); }

        /* 操作エリア */
        .punch-area { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        button { padding: 12px 5px; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .in { background-color: var(--accent); }
        .out { background-color: var(--primary); }
        button small { display: block; font-size: 0.6rem; font-weight: normal; margin-top: 2px; opacity: 0.9; }

        /* 履歴エリア */
        .history-section { border-top: 2px solid #eee; padding-top: 15px; }
        h3 { font-size: 0.9rem; margin-bottom: 10px; color: #666; }
        .history-list { max-height: 250px; overflow-y: auto; padding-right: 5px; }
        .log-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f0f0f0; font-size: 0.85rem; }
        .log-type { font-weight: bold; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; color: white; }
        .type-in { background: var(--accent); }
        .type-out { background: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h1 id="monthYear">My Calendar</h1>
    
    <div class="calendar-grid" id="calendar"></div>

    <div class="punch-area">
        <button class="in" onclick="addRecord('IN')">
            Check In
            <small>काम सुरु / 開始</small>
        </button>
        <button class="out" onclick="addRecord('OUT')">
            Check Out
            <small>काम सकियो / 終了</small>
