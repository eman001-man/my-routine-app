<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Haiku Master</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f4f1ea;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border-top: 8px solid #8c2727;
        }
        .haiku-box {
            font-size: 1.5rem;
            font-style: italic;
            margin: 30px auto;
            min-height: 120px;
            line-height: 1.8;
            color: #333;
        }
        button {
            background-color: #8c2727;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 30px;
            transition: 0.3s;
            box-shadow: 0 4px 0 #5a1919;
        }
        button:hover { background-color: #a63e3e; transform: translateY(-2px); }
        button:active { transform: translateY(2px); box-shadow: none; }
        .back-link { margin-top: 25px; display: block; color: #666; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Haiku Master</h2>
    
    <div id="haikuDisplay" class="haiku-box">
        Click the button<br>to create<br>a new Haiku.
    </div>

    <button onclick="generateHaiku()">Compose a Haiku</button>
    
    <a href="index.html" class="back-link">← Back to Routine</a>
</div>

<script>
    // 英語の五・七・五（音節）をイメージしたフレーズ集
    const line1 = ["Morning sun rises", "A quiet garden", "Coding with AI", "Step by step I go", "Coffee in my hand", "The wind whispers"];
    const line2 = ["Chasing dreams across the sky", "Learning something new today", "Building tools for everyone", "Finding peace in every day", "From Japan to the whole world", "Future starts with one small click"];
    const line3 = ["A new journey starts", "The flower blooms now", "Heart full of hope", "Life is beautiful", "Never too late", "Spring is in the air"];

    function generateHaiku() {
        const display = document.getElementById('haikuDisplay');
        display.style.opacity = 0; // フェードアウト演出
        
        setTimeout(() => {
            const l1 = line1[Math.floor(Math.random() * line1.length)];
            const l2 = line2[Math.floor(Math.random() * line2.length)];
            const l3 = line3[Math.floor(Math.random() * line3.length)];
            
            display.innerHTML = `${l1}<br>${l2}<br>${l3}`;
            display.style.opacity = 1;
        }, 300);
    }
</script>

</body>
</html>
